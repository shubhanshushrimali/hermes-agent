# docker/langfuse.yml — Self-hosted Langfuse for Hermes Agent
# Usage: docker compose -f docker/langfuse.yml up -d
# Dashboard: http://localhost:3000
#
# Default credentials: admin@hermes.local / hermes-admin
# Default API keys are pre-seeded — no manual setup needed:
#   LANGFUSE_HOST=http://localhost:3000
#   LANGFUSE_PUBLIC_KEY=pk-lf-hermes-local
#   LANGFUSE_SECRET_KEY=sk-lf-hermes-local
#
# These keys are auto-configured by gateway/env_config.py when
# no custom keys are set.

services:
  langfuse:
    image: langfuse/langfuse:latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://langfuse:langfuse@postgres:5432/langfuse"
      NEXTAUTH_SECRET: "hermes-aizen-secret-change-in-production"
      SALT: "hermes-aizen-salt-change-in-production"
      NEXTAUTH_URL: "http://localhost:3000"
      TELEMETRY_ENABLED: "false"
      # Seed admin user + API keys on first start.
      LANGFUSE_INIT_ORG_ID: "hermes-org"
      LANGFUSE_INIT_ORG_NAME: "Hermes Agent"
      LANGFUSE_INIT_PROJECT_ID: "hermes-project"
      LANGFUSE_INIT_PROJECT_NAME: "Hermes Agent"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "pk-lf-hermes-local"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "sk-lf-hermes-local"
      LANGFUSE_INIT_USER_EMAIL: "admin@hermes.local"
      LANGFUSE_INIT_USER_NAME: "Hermes Admin"
      LANGFUSE_INIT_USER_PASSWORD: "hermes-admin"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  langfuse_pg_data:
