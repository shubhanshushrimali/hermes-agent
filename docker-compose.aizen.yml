# Hermes Agent — Aizen Version: Complete Docker Compose
# ONE COMMAND: docker compose -f docker-compose.aizen.yml up -d
#
# This deploys the full stack:
#   - Gateway + Dashboard (core agent)
#   - Mobile PWA (served by Caddy)
#   - Code Server (VS Code in browser)
#   - Caddy (reverse proxy + HTTPS)
#   - Langfuse (observability)
#   - Postgres (Langfuse backend)
#
# All services on one network, all data persisted in named volumes
# (hermes-home, not a ~/.hermes bind mount — that does not expand on
# Windows Docker Desktop). After up:
#   PWA:        http://localhost/
#   Dashboard:  http://localhost:9119
#   Gateway:    http://localhost:5005/health
#
# Native-port stack without Caddy/PWA: docker-compose.windows.yml
# Set HERMES_UID/HERMES_GID to match your host user (default: 10000).

services:
  # ================================================================
  # Core: Gateway + Agent
  # ================================================================
  gateway:
    build: .
    image: hermes-agent
    container_name: hermes-gateway
    restart: unless-stopped
    ports:
      - "5005:5005"
    volumes:
      - hermes-home:/opt/data
      - hermes-workspace:/workspace
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - HERMES_WORKSPACE=/workspace
      # Langfuse auto-config (matches docker/langfuse.yml seeds).
      - LANGFUSE_HOST=http://langfuse:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-hermes-local}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-hermes-local}
      # API server for PWA access. Port MUST match the published mapping.
      # The PWA uses same-origin when Caddy serves it on :80; native
      # Hermes listens on 8642.
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=5005
      - API_SERVER_KEY=${API_SERVER_KEY:-hermes-local-key}
      - API_SERVER_CORS_ORIGINS=*
    depends_on:
      langfuse:
        condition: service_healthy
    command: ["gateway", "run"]
    networks:
      - hermes-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5005/health || curl -sf http://localhost:5005/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ================================================================
  # Dashboard
  # ================================================================
  dashboard:
    image: hermes-agent
    container_name: hermes-dashboard
    restart: unless-stopped
    ports:
      - "9119:9119"
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - hermes-home:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    command: ["dashboard", "--host", "0.0.0.0", "--no-open", "--insecure"]
    networks:
      - hermes-net

  # ================================================================
  # Mobile PWA (static files served by Caddy)
  # ================================================================
  caddy:
    image: caddy:latest
    container_name: hermes-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.aizen:/etc/caddy/Caddyfile:ro
      - ./apps/mobile-pwa/public:/srv/pwa:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - API_SERVER_KEY=${API_SERVER_KEY:-hermes-local-key}
    networks:
      - hermes-net

  # ================================================================
  # Code Server (VS Code in browser)
  # ================================================================
  code-server:
    image: codercom/code-server:latest
    container_name: hermes-code-server
    restart: unless-stopped
    ports:
      - "8443:8080"
    volumes:
      - hermes-workspace:/home/coder/project
      - code-server-data:/home/coder/.local
    environment:
      - PASSWORD=${CODE_SERVER_PASSWORD:-hermes}
      - SUDO_PASSWORD=${CODE_SERVER_SUDO_PASSWORD:-hermes}
    networks:
      - hermes-net

  # ================================================================
  # Langfuse (Observability)
  # ================================================================
  langfuse:
    image: langfuse/langfuse:latest
    container_name: hermes-langfuse
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://langfuse:langfuse@langfuse-db:5432/langfuse"
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:-hermes-aizen-secret-change-in-production}"
      SALT: "${LANGFUSE_SALT:-hermes-aizen-salt-change-in-production}"
      NEXTAUTH_URL: "http://localhost:3000"
      TELEMETRY_ENABLED: "false"
      # Pre-seed org, project, and API keys on first boot.
      LANGFUSE_INIT_ORG_ID: "hermes-org"
      LANGFUSE_INIT_ORG_NAME: "Hermes Agent"
      LANGFUSE_INIT_PROJECT_ID: "hermes-project"
      LANGFUSE_INIT_PROJECT_NAME: "Hermes Agent"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-pk-lf-hermes-local}"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-sk-lf-hermes-local}"
      LANGFUSE_INIT_USER_EMAIL: "admin@hermes.local"
      LANGFUSE_INIT_USER_NAME: "Hermes Admin"
      LANGFUSE_INIT_USER_PASSWORD: "${LANGFUSE_ADMIN_PASSWORD:-hermes-admin}"
    depends_on:
      langfuse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hermes-net

  langfuse-db:
    image: postgres:16-alpine
    container_name: hermes-langfuse-db
    restart: unless-stopped
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hermes-net

# ================================================================
# Volumes
# ================================================================
volumes:
  hermes-home:
  hermes-workspace:
  code-server-data:
  caddy-data:
  caddy-config:
  langfuse-db-data:

# ================================================================
# Network
# ================================================================
networks:
  hermes-net:
    driver: bridge
